name: Evolutionary model tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/evolutionary-ecology-completion, feat/boids-completion-workstream]
  workflow_dispatch:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run model tests
        run: node --test tests/*.test.js
      - name: Validate paired Run 16 experiment batch
        run: |
          node research/run16-followup.js > /tmp/run16-followup.json
          node -e "const batch=require('/tmp/run16-followup.json'); if(batch.runs.length!==60 || batch.scenarios.length!==6 || new Set(batch.pairedSeeds).size!==10) process.exit(1); console.log('60 paired-seed runs across six conditions validated')"
      - name: Check worker and module syntax
        run: |
          node --check evolution.js
          node --check genetics.js
          node --check chromosome.js
          node --check boids-worker.js
