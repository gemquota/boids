name: Deploy Boids v2 to GitHub Pages

on:
  push:
    branches:
      - reboot/ecosystem-evolution
    paths:
      - 'app.js'
      - 'index.html'
      - 'core/**'
      - 'organisms/**'
      - 'labs/**'
      - 'art/**'
      - 'v2/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out legacy site
        uses: actions/checkout@v4
        with:
          path: current
          ref: main
          fetch-depth: 0
      - name: Check out current v2
        uses: actions/checkout@v4
        with:
          path: reboot-src
          ref: reboot/ecosystem-evolution
          fetch-depth: 0
      - name: Test v2
        working-directory: reboot-src
        run: |
          node --check app.js
          npm test
      - name: Assemble legacy root and v2
        run: |
          mkdir -p _site/v2
          git -C current archive HEAD | tar -xf - -C _site
          git -C reboot-src archive HEAD | tar -xf - -C _site/v2
          rm -rf _site/.old _site/.github _site/v2/.old _site/v2/.github
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
