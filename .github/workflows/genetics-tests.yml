name: Genetics checks
on:
  push:
    branches: [release/v0.2-dna-update]
  pull_request:
    branches: [main]
    paths:
      - 'boids-worker.js'
      - 'genetics.js'
      - 'tests/**'
      - '.github/workflows/genetics-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d7c6b1c4c5e4f4b3a5d0d7a7b8c # v4.0.3
        with:
          node-version: 22
      - name: Syntax-check runtime
        run: node --check boids-worker.js && node --check genetics.js
      - name: Run genetics tests
        run: node --test tests/genetics.test.js
