name: Genetics checks
on:
  push:
    branches: [release/v0.2-dna-update]
  pull_request:
    branches: [main]
    paths:
      - 'boids-worker.js'
      - 'chromosome.js'
      - 'genetics.js'
      - 'chromosome.js'
      - 'tests/**'
      - '.github/workflows/genetics-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Syntax-check runtime
        run: node --check boids-worker.js && node --check genetics.js && node --check chromosome.js
      - name: Run genetics tests
        run: node --test tests/genetics.test.js tests/chromosome.test.cjs
