name: Validate Boids
on:
  pull_request:
  push:
    branches: [main]
jobs:
  syntax-and-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          html = open('index.html', encoding='utf-8').read()
          match = re.search(r'<script>([\s\S]*?)</script>', html)
          if not match:
              raise SystemExit('Inline application script not found')
          open('/tmp/boids-app.js', 'w', encoding='utf-8').write(match.group(1))
          PY
          node --check /tmp/boids-app.js
          node --check boids-worker.js
          node tests/worker-determinism.test.cjs
      - name: Verify 100 registered sliders and worker wiring
        run: |
          python3 - <<'PY'
          import re
          html = open('index.html', encoding='utf-8').read()
          worker = open('boids-worker.js', encoding='utf-8').read()
          static = re.search(r'const ranges=\[([^]]+)\]', html)
          extra = re.search(r'const extraSliderDefs=(\[[\s\S]*?\])\.map', html)
          if not static or not extra:
              raise SystemExit('Slider registries not found')
          static_ids = re.findall(r"'([A-Za-z][A-Za-z0-9]*)'", static.group(1))
          extra_ids = re.findall(r'\["([A-Za-z][A-Za-z0-9]*)"', extra.group(1))
          ids = static_ids + extra_ids
          if len(ids) != 100 or len(set(ids)) != 100:
              raise SystemExit(f'Expected 100 unique sliders, found {len(ids)} ({len(set(ids))} unique)')
          missing = [key for key in extra_ids if f'cfg.{key}' not in worker]
          if missing:
              raise SystemExit('Controls not wired into worker: ' + ', '.join(missing))
          if 'function exportSnapshot()' not in worker or 'function restoreSnapshot(' not in worker:
              raise SystemExit('World snapshot/restore handlers missing')
          if 'indexedDB.open' not in html or 'persistObservatory' not in html:
              raise SystemExit('Persistent world/observatory storage missing')
          required_ui = [
              'Math.round((clamped-lo)/step)', 'applySettings({...ecologicalBaseline',
              'schemaVersion=2', 'snapshotWaiters', 'flushPersistentState', 'store.put(prior.result,\'previous\')', 'store.get(\'previous\')',
              'Object.assign(helpDescriptions,'
          ]
          missing_ui = [item for item in required_ui if item not in html]
          if missing_ui:
              raise SystemExit('Missing settings/persistence/help safeguards: ' + ', '.join(missing_ui))
          required_worker = [
              'schemaVersion:8', 'requestId:m.requestId', 'rngState,nextIndividualId', 'individualId:individualId.slice(0,N)', 'parentA[child]=individualId[mother]', 'updateOrder[orderIndex]', 'xNext[i]=x[i]+nextVx', 'let swap=x;x=xNext', 'const fixedDt=1/60', 'accumulator+=elapsed*cfg.timeScale', 'foodDemandByPatch[best]+=cfg.foodBite*cfg.foodDepletion', 'foodGain=foodGainByAgent[i]', 'attackTarget[i]=huntIndex', 'attackWinner[target]=hunter',
              'Math.round(values[key])', 'distanceWeight+geneticWeight',
              'huntIndex=-1', 'cfg.aggressionSelection*ag', 'traitGenes[i*10+1]', 'cfg.threatSteering;ay+=threatY',
              'turnSignal*cfg.neuralTurnGain*traitGenes[i*10+7]+vx[i]/heading*accelSignal'
          ]
          missing_worker = [item for item in required_worker if item not in worker]
          if missing_worker:
              raise SystemExit('Missing worker correctness safeguards: ' + ', '.join(missing_worker))
          for key in ['flockNoise','alignmentMemory','cohesionBias','separationExponent',
                      'neighbourDensityScale','flowDrift','eddyFrequency','foodRegrowth',
                      'foodDepletion','foodCompetition','mateDriveNoise','mateDistanceBias',
                      'mutationDrift','rewireChance','lineageDrift','neuralNoise','neuralInertia',
                      'learningMomentum','sensoryNoise','juvenileGrowth','adultMaintenance',
                      'predatorSearch','predatorPersistence','predatorTurn','predatorSatiation']:
              if f'"{key}":[' not in html:
                  raise SystemExit('Missing detailed help description for ' + key)
          for item in ['foodDemandByPatch[best]+=cfg.foodBite*cfg.foodDepletion', 'attackTarget[i]=huntIndex', 'attackWinner[target]=hunter', 'foodGain=foodGainByAgent[i]']:
              if item not in worker:
                  raise SystemExit('Missing batched interaction invariant: ' + item)
          if 'f.stock-=eaten' in worker or 'energy[huntIndex]=0' in worker:
              raise SystemExit('Feeding and hunting must not mutate targets sequentially inside the agent loop')
          if 'traitGenes[i*6+1]' in worker or 'traitGenes.slice(0,N*6)' in worker:
              raise SystemExit('Ten-locus phenotype indexing must be used consistently')
          for item in ['traitGenes[i*10+6]', 'traitGenes[i*10+7]', 'traitGenes[i*10+8]', 'traitGenes[i*10+9]', 'schemaVersion:8', 'function kinshipCoefficient', 'kinshipRelatedness(individualId[i],individualId[j])', 'recordPedigree(individualId[child],parentA[child],parentB[child])', 'pedigree:Array.from(pedigree.entries())']:
              if item not in worker:
                  raise SystemExit('Missing inherited phenotype mechanic: ' + item)
          for item in ['innovationFor(src,dst)', 'innovationRegistry:Array.from(innovationRegistry.entries())', 'paternalInnovation.set(innovation.subarray', 'function cloneGenome(child,mother,fatherOffset)', 'genesA=new Map(),genesB=new Map()']:
              if item not in worker:
                  raise SystemExit('Missing innovation-tracked neuroevolution invariant: ' + item)
          if 'let pa=mo+g*3,pb=fatherOffset+g*3' in worker:
              raise SystemExit('Neural crossover must align homologous innovations, not positional gene slots')
          for item in ['seasonalTotal=0', 'coverByAgent[i]=cover*.65', 'foodGainByAgent[i]=eaten*f.quality*cfg.foodEnergyYield*cfg.foodCompetition', 'temperatureAnomaly=', 'movementCost=', 'foodQuality:food.reduce']:
              if item not in worker:
                  raise SystemExit('Missing spatial ecology or energetic mechanism: ' + item)
          for item in ['selectionDifferentials', 'meanLifetimeOffspring', 'reproductiveSuccess:Array.from(reproductiveSuccess.entries())', 'function exportExperimentData()', "m.type==='exportData'", 'attackAttempts,foodClaims,foodConsumed']:
              if item not in worker:
                  raise SystemExit('Missing experiment measurement/export invariant: ' + item)
          for item in ['id="exportExperiment"', "m.type==='exportData'", 'Experiment data exported:']:
              if item not in ui:
                  raise SystemExit('Missing functional experiment export UI: ' + item)
          if 'Math.random()' in worker:
              raise SystemExit('Worker must use the seeded random generator for reproducible experiments')
          for item in ['function seedRandom(seed)', 'function random()', 'new Uint32Array(cap)', 'paternalId[mother]=individualId[father]', 'schemaVersion:8', 'traitGenes=new Float32Array(cap*10)', 'for(let k=0;k<10;k++)', 'riskTolerance:meanRiskTolerance/Math.max(1,N)']:
              if item not in worker:
                  raise SystemExit('Missing phase-one simulation invariant: ' + item)
          if 'for(let i=0;i<N;i++){let energyBefore=energy[i]' in worker:
              raise SystemExit('Agent updates must use the shuffled immutable update cohort')
          print('Validated 100 sliders, worker wiring, deterministic RNG, double-buffered motion, stable pedigree IDs and snapshot migration.')
          PY
