name: Validate Boids
on:
  pull_request:
  push:
    branches: [main]
jobs:
  syntax-and-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax and regression tests
        run: |
          python3 - <<'PY'
          import re
          html = open('index.html', encoding='utf-8').read()
          match = re.search(r'<script>(.*?)</script>', html, re.S)
          if not match:
              raise SystemExit('Inline application script not found')
          open('/tmp/boids-app.js', 'w', encoding='utf-8').write(match.group(1))
          PY
          node --check /tmp/boids-app.js
          node --check boids-worker.js
          node --check chromosome.js
          node --check config-registry.js
          node --check config-schema.js
          node tests/config-schema.test.cjs
          node tests/ecology-visual.test.cjs
          node tests/config-registry.test.cjs
          node tests/genetics.test.js
          node tests/chromosome.test.cjs
          node tests/worker-determinism.test.cjs
          node tests/html-script-syntax.test.cjs
          node tests/worker-benchmark.test.cjs
      - name: Verify plant-only ecology, chromosome wiring and controls
        run: |
          python3 - <<'PY'
          import json, re
          html = open('index.html', encoding='utf-8').read()
          worker = open('boids-worker.js', encoding='utf-8').read()
          schema = open('config-schema.js', encoding='utf-8').read()
          evolution = open('evolution.js', encoding='utf-8').read()
          baseline_match = re.search(r'const ecologicalBaseline=(\{.*?\});for\(const trait of expressionTraits\)', html)
          if not baseline_match:
              raise SystemExit('Rapid-evolution startup baseline missing')
          baseline = json.loads(baseline_match.group(1))
          expected = {'count': 800, 'timeScale': 0.55, 'connections': 24, 'hidden': 10, 'brainRate': 2,
                      'mutation': 0.075, 'mutationSize': 0.34, 'drive': 0.78, 'ageMin': 10,
                      'gestation': 14, 'selection': 0.72, 'plantPreference': 0.95,
                      'plantRangeScale': 2.3, 'plantMinRange': 66, 'plantSteering': 0.28}
          for key, value in expected.items():
              if baseline.get(key) != value:
                  raise SystemExit(f'Unexpected rapid-evolution baseline {key}: {baseline.get(key)}')
          core = re.search(r'const coreSliderDefs=(\[.*?\])\.map', schema, re.S)
          extra = re.search(r'const extraSliderDefs=(\[.*?\])\.map', schema, re.S)
          traits_match = re.search(r'const expressionTraits=\[(.*?)\];', schema, re.S)
          fields_match = re.search(r'const expressionFields=\[(.*?)\];', schema, re.S)
          mutations_match = re.search(r'const expressionMutationFields=\[(.*?)\];', schema, re.S)
          if not all((core, extra, traits_match, fields_match, mutations_match)):
              raise SystemExit('Shared slider or expression schema missing')
          core_ids = re.findall(r'\["([A-Za-z][A-Za-z0-9]*)"', core.group(1))
          extra_ids = re.findall(r'\["([A-Za-z][A-Za-z0-9]*)"', extra.group(1))
          traits = re.findall(r"\{key:'([A-Za-z]+)'", traits_match.group(1))
          fields = re.findall(r"\{key:'([A-Za-z]+)'", fields_match.group(1))
          mutation_fields = re.findall(r"\{key:'([A-Za-z]+)'", mutations_match.group(1))
          ids = core_ids + extra_ids + [f'expr_{t}_{f}' for t in traits for f in fields] + [f'trait_{t}_{f}' for t in traits for f in mutation_fields]
          if len(ids) != 190 or len(set(ids)) != 190:
              raise SystemExit(f'Expected 190 unique controls, found {len(ids)} ({len(set(ids))} unique)')
          if any(x in ids for x in ['foodPatches','foodRegen','foodBite','foodEnergyYield','foodCapacity','foodRegrowth','foodDepletion','foodCompetition']):
              raise SystemExit('Legacy food-patch controls must be removed')
          if 'BoidsConfigSchema.fieldGuide' not in html or 'BoidsConfigSchema.normalizeDependencies' not in html:
              raise SystemExit('Shared field guide/dependency schema is not consumed by the UI')
          if 'BoidsChromosome.fromRuntime' not in worker or 'BoidsChromosome.decode' not in worker or 'chromosome.js?v=20261110-hex-dna-v1' not in worker:
              raise SystemExit('Hexadecimal chromosome runtime wiring is missing')
          if any(x in worker for x in ['function seedFood','food=[]','food.length','foodDemandByPatch','foodStock:']):
              raise SystemExit('Food patches or their hidden stock must not exist in the worker')
          if 'plantGain' not in worker or 'plantEatingFlag[i]=1' not in worker or 'plantBiomass' not in worker:
              raise SystemExit('Plant grazing and biomass telemetry are required')
          if 'Math.min(bestPlant.biomass,.00008*dt*60)' not in worker:
              raise SystemExit('Plant grazing rate must remain bounded')
          if 'Math.max(64,Math.min(120,Math.round(W*H/14000)))' not in worker:
              raise SystemExit('Initial spore bank must support plant-only ecology')
          hue = worker[worker.index('function phenotypeHue(i)'):].splitlines()[0]
          if 'weight' in hue or 'genome[o+2]' in hue:
              raise SystemExit('Visible boid colour must not track mutable neural weights')
          if 'const includeHistory=now-lastHistoryPost>5000' not in worker:
              raise SystemExit('Large Observatory histories must be throttled')
          if "panel==='analysis'&&Date.now()-lastChartRender>3500" not in html:
              raise SystemExit('Charts must not redraw while the Observatory drawer is closed')
          if "new Worker('./boids-worker.js?v=20261111-regulatory-history-v29')" not in html:
              raise SystemExit('Updated worker cache-bust missing')
          if 'r=2.8+Math.min(3.4,p.size*2.7)' not in worker or 'hexPath(p.x,p.y,r*.56' not in worker:
              raise SystemExit('Faceted hexagonal plant crowns must remain visibly sized')
          if 'function drawWaterways()' not in worker or 'function nearestFreshwater(' not in worker:
              raise SystemExit('Shared river and freshwater geometry is missing')
          if 'settleAfter:rand(5,10),landed:false' not in worker or 'sp.landed&&sp.settleClock>=1.8' not in worker:
              raise SystemExit('Spores must float, land, settle and then germinate')
          if 'BoidsEvolution.assignSpecies' not in worker or 'BoidsEvolution.updateSpeciesStatistics' not in worker or 'speciesThresholdCurrent' not in worker:
              raise SystemExit('Live adaptive NEAT speciation is missing')
          if 'regulatoryGenes' not in worker or 'cloneRegulatoryGenes(child,mother)' not in worker:
              raise SystemExit('Inherited cis-regulatory genetics is missing')
          if 'traitAlleleFrequencies' not in worker or 'meanHeritability' not in worker or 'meanInbreeding' not in worker or 'sexRatioEffectiveSize' not in worker:
              raise SystemExit('Population genetics telemetry is missing')
          if 'geneticsHistoryChart' not in html or 'mSpeciesThreshold' not in html or 'mSpeciesStagnant' not in html or 'mSpeciesInnovations' not in html or 'mEffectiveBreeders' not in html or 'mRegulatoryNodes' not in html or 'mRegulatoryEdges' not in html or 'mRegulatoryDiversity' not in html or 'mPhenotypicVariance' not in html or 'mNe' not in html:
              raise SystemExit('Evolutionary Observatory metrics are missing')
          if 'recurrentMutationRate' not in worker or 'activationMutationRate' not in worker or 'nodeDeletionRate' not in worker or 'speciesStagnationLimit' not in worker or 'recurrentMutationRate' not in worker or 'updateSpeciesStatistics' not in evolution:
              raise SystemExit('Variable node activation and deletion mutations are missing')
          print('Validated 190 controls, plant-only ecology, live NEAT topology, regulatory inheritance, population genetics and Observatory wiring.')
          PY
