<style>

body{display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 40%,#1b1030,#080512 70%,#030208)}

 #panel{height:var(--drawer-height,min(48vh,430px));min-height:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#130d20f2,#090612f8);border-top:1px solid #ffffff26;box-shadow:0 -12px 50px #0008;z-index:2}

function makeDance(name){return{id:++trackId,type:'dance',name,muted:false,collapsed:false,volume:1,pages:[Array.from({length:danceNames.length},(_,ri)=>Array.from({length:16},(_,si)=>ri===0&&[0,4,8,12].includes(si)||ri===1&&[2,6,10,14].includes(si)||ri===10&&[3,11].includes(si)?1:0))]}}function blankPattern(type){return type==='drum'?Array.from({length:4},()=>Array(16).fill(0)):type==='dance'?Array.from({length:danceNames.length},()=>Array(16).fill(0)):Array.from({length:12},()=>Array(16).fill(0))}

function renderTracks(){tracksEl.innerHTML='';updatePageBar();for(const tr of tracks){const pattern=tr.pages[activePage]||blankPattern(tr.type);const card=document.createElement('div');card.className='track'+(tr.collapsed?' collapsed':'');card.dataset.type=tr.type;card.dataset.id=tr.id;const head=document.createElement('div');head.className='trackhead';head.innerHTML='<span class="trackname"></span><span class="kind"></span><span class="spacer"></span><button class="collapse"></button><button class="mute"></button><button class="remove danger">×</button>';head.querySelector('.trackname').textContent=tr.name;head.querySelector('.kind').textContent=tr.type==='drum'?'DRUM MACHINE':tr.type==='dance'?'VISUAL MOTION':'CHROMATIC PIANO';head.querySelector('.collapse').textContent=tr.collapsed?'＋':'−';head.querySelector('.collapse').title=tr.collapsed?'Expand instrument':'Minimise instrument';head.querySelector('.collapse').onclick=()=>{tr.collapsed=!tr.collapsed;renderTracks()};head.querySelector('.mute').textContent=tr.muted?'MUTED':'MUTE';head.querySelector('.mute').classList.toggle('active',tr.muted);head.querySelector('.mute').onclick=()=>{tr.muted=!tr.muted;renderTracks()};head.querySelector('.remove').onclick=()=>{if(tracks.length>1){tracks.splice(tracks.indexOf(tr),1);renderTracks()}};card.appendChild(head);const lanes=document.createElement('div');lanes.className='lanes';const labels=tr.type==='drum'?drumNames:tr.type==='dance'?danceNames:noteNames;pattern.forEach((row,ri)=>{const lane=document.createElement('div');lane.className='lane'+(tr.type==='piano'?' chromatic':'');const label=document.createElement('span');label.className='lanelabel'+(tr.type==='piano'&&[1,3,6,8,10].includes(ri)?' accidental':'');label.textContent=labels[ri];lane.appendChild(label);
if(tr.type==='piano'){const covered=new Set();for(let si=0;si<16;si++){if(covered.has(si))continue;const dur=Math.max(0,Math.min(16-si,Number(row[si])||0));if(dur>0){const b=document.createElement('button');b.className='step on note-span'+([1,3,6,8,10].includes(ri)?' accidental':'');b.style.setProperty('--step-color','#'+['ff69c7','e98cff','b58aff','8b9dff','62c9ff','56e9cf','b6f27c','ffd16c','ff9d68','f16f91','9d8cff','69c8ff'][ri]);b.style.setProperty('--start',si+2);b.style.setProperty('--duration',dur);b.style.gridColumn=(si+2)+' / span '+dur;b.dataset.start=si;b.dataset.step=si;b.dataset.duration=dur;b.title=labels[ri]+' · step '+(si+1)+' · '+dur+' step(s)';b.setAttribute('aria-label',b.title);b.onclick=()=>{if(!resizingNote){row[si]=0;renderTracks()}};b.addEventListener('pointerdown',e=>{const rect=b.getBoundingClientRect();if(e.clientX>=rect.right-13){e.preventDefault();e.stopPropagation();resizingNote={trId:tr.id,row:ri,start:si,lane,pattern,card};b.setPointerCapture(e.pointerId)}});b.addEventListener('pointermove',e=>{if(!resizingNote||resizingNote.trId!==tr.id||resizingNote.row!==ri||resizingNote.start!==si)return;const rect=lane.getBoundingClientRect(),labelWidth=42,cell=(rect.width-labelWidth)/16,target=Math.floor((e.clientX-rect.left-labelWidth)/cell);row[si]=Math.max(1,Math.min(16-si,target-si+1));for(let k=si+1;k<si+row[si];k++)row[k]=0;b.style.gridColumn=(si+2)+' / span '+row[si]});b.addEventListener('pointerup',()=>{if(resizingNote&&resizingNote.trId===tr.id){resizingNote=null;renderTracks()}});lane.appendChild(b);for(let k=si;k<si+dur;k++)covered.add(k)}else{const b=document.createElement('button');b.className='step'+([1,3,6,8,10].includes(ri)?' accidental':'');b.dataset.step=si;b.style.gridColumn=String(si+2);b.onclick=()=>{row[si]=1;renderTracks()};b.setAttribute('aria-label',labels[ri]+' step '+(si+1));lane.appendChild(b)}}}else{row.forEach((on,si)=>{const b=document.createElement('button');b.className='step'+(on?' on':'');b.dataset.step=si;b.style.setProperty('--step-color',tr.type==='dance'?danceColours[ri]:drumColours[ri]);b.style.gridColumn=String(si+2);b.setAttribute('aria-label',labels[ri]+' step '+(si+1));b.onclick=()=>{row[si]=row[si]?0:1;b.classList.toggle('on',!!row[si])};lane.appendChild(b)})}lanes.appendChild(lane)});card.appendChild(lanes);tracksEl.appendChild(card)}}function setupAudio(){if(audioCtx)return;if(!window.AudioContext&&!window.webkitAudioContext)return;audioCtx=new(window.AudioContext||window.webkitAudioContext)();master=audioCtx.createGain();master.gain.value=.72;analyser=audioCtx.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.78;frequency=new Uint8Array(analyser.frequencyBinCount);waveform=new Uint8Array(analyser.fftSize);master.connect(analyser);analyser.connect(audioCtx.destination);createNoiseBed()}

function placeObject(midi,kind,at,stepIndex){const lo=kind==='drum'?0:48,hi=kind==='drum'?3:84,p=clamp((midi-lo)/(hi-lo),0,1);particles.push({a:kind==='drum'?angle+(stepIndex/16-.5)*1.1:baseAngle+(p-.5)*Math.PI*1.7,r:.15+p*.55,life:1,size:kind==='drum'?4+kind*1:3+p*7,hue:kind==='drum'?[335,28,190,95][midi]:(275+p*170)%360,kind,seed:Math.random()*TAU});if(particles.length>420)particles.splice(0,particles.length-420)}
function spawnPassItems(count,speed){for(let i=0;i<count;i++)particles.push({a:Math.random()*TAU,r:.05+Math.random()*.18,life:1,size:4+Math.random()*7,hue:Math.random()*360,kind:'pass',seed:Math.random()*TAU,radialSpeed:.006*speed*(.7+Math.random()),angularSpeed:(Math.random()-.5)*.012*speed})}function scheduleStep(s,t){const stepDuration=60/Number($('bpm').value||112)/4;for(const tr of tracks){if(tr.muted)continue;const pattern=tr.pages[activePage]||tr.pages[0];if(tr.type==='dance'){pattern.forEach((row,ri)=>{if(!row[s])return;switch(ri){case 0:beatPulse=1;pop=1;break;case 1:rayShimmer=1;break;case 2:raysEnabled=true;break;case 3:raysEnabled=false;break;case 4:rayDirection*=-1;break;case 5:raysFrozen=!raysFrozen;break;case 6:rayBaseCount=clamp(rayBaseCount+8,8,256);break;case 7:rayBaseCount=clamp(rayBaseCount-8,8,256);break;case 8:danceSpeed=.45;spawnPassItems(2,.55);break;case 9:danceSpeed=1.9;spawnPassItems(3,1.5);break;case 10:spawnPassItems(5,.9);break;}})}else if(tr.type==='drum'){pattern.forEach((row,ri)=>{if(row[s]){playDrum(ri,t,tr.volume);placeObject(ri,'drum',t,s);if(ri===0){beatPulse=1;pop=1}}})}else{pattern.forEach((row,ri)=>{if(row[s]){const midi=notes[ri];const duration=Math.max(1,Number(row[s])||1);synth(midi,t,Math.min(.9,duration*60/Number($('bpm').value||112)/4*.92),tr.volume,'triangle');placeObject(midi,'note',t,s)}})}}if(autoFill){const ost=[0,-1,2,-1,4,-1,2,-1,0,-1,5,-1,4,-1,2,-1][s];if(ost>=0){synth(notes[ost]-12,t,.34,.075,'sine');placeObject(notes[ost]-12,'note',t,s)}if(bar%4===3&&s>=12){if(Math.random()<.8){const d=s===12?0:(Math.random()<.55?1:2);playDrum(d,t,.42);placeObject(d,'drum',t,s)}if(s===15&&Math.random()<.7)playDrum(3,t,.34)}}

}
function tick(){if(!running||!audioCtx)return;const now=audioCtx.currentTime;while(nextTime<now+.12){scheduleStep(step,nextTime);step++;if(step>=16){step=0;bar++;activePage=(activePage+1)%pageCount;renderTracks()}nextTime+=60/Number($('bpm').value||112)/4}updatePlayhead()}

function pause(){running=false;clearInterval(timer);timer=null;$('play').textContent='▶ PLAY';$('play').classList.remove('active')}
function stop(){pause();step=0;bar=0;beatPulse=0;updatePlayhead()}
function updatePlayhead(){document.querySelectorAll('.step.current').forEach(x=>x.classList.remove('current'));if(running)document.querySelectorAll('.step[data-step="'+step+'"]').forEach(x=>x.classList.add('current'))}
function regenerate(){for(const tr of tracks){tr.pages=tr.pages.map((old,pi)=>{const fresh=tr.type==='drum'?makeDrum(tr.name).pages[0]:makePiano(tr.name).pages[0];if(tr.type==='drum'){for(let i=0;i<16;i++){if(Math.random()<.12)fresh[2][i]=1;if(i%4===3&&Math.random()<.35)fresh[1][i]=1}}else{for(let i=0;i<16;i++){if(Math.random()<.18)fresh[Math.floor(Math.random()*12)][i]=1}}return fresh})}renderTracks()}
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
function readAudio(){if(!analyser)return;analyser.getByteFrequencyData(frequency);analyser.getByteTimeDomainData(waveform);const avg=(a,b)=>{let v=0;for(let i=a;i<b;i++)v+=frequency[i];return v/Math.max(1,b-a)/255};energy.bass=energy.bass*.7+avg(1,12)*.3;energy.mid=energy.mid*.7+avg(12,90)*.3;energy.high=energy.high*.7+avg(90,360)*.3;energy.all=energy.all*.7+avg(1,500)*.3}
function draw(t){ctx.fillStyle='#080512';ctx.fillRect(0,0,W,H);const cx=W/2,cy=H/2;const glow=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.75);glow.addColorStop(0,'#281044');glow.addColorStop(.5,'#100a20');glow.addColorStop(1,'#030208');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
const pulse=beatPulse;const rot=angle+danceOffset+spinAngle*rayDirection;const half=(fov+energy.bass*26+pop*8)*Math.PI/360;ctx.save();ctx.translate(cx,cy);ctx.scale(1+pop*.09,1+pop*.09);
ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,Math.hypot(W,H),rot-half,rot+half);ctx.closePath();ctx.fillStyle='hsla('+(290+energy.mid*100)+',95%,60%,'+(.035+energy.bass*.09)+')';ctx.fill();
if(raysEnabled)for(let i=0;i<rayCount;i++){const p=i/(rayCount-1||1),a=rot+(p-.5)*2*half,dx=Math.cos(a),dy=Math.sin(a),dist=Math.min(Math.abs(dx)>1e-6?W/2/Math.abs(dx):Infinity,Math.abs(dy)>1e-6?H/2/Math.abs(dy):Infinity),v=frequency?frequency[(i*11)%frequency.length]/255:0,amp=clamp(pulse*.8+v*.22+energy.mid*.16,0,1),reach=dist*(.56+.44*amp),hue=0;let hit=null;for(const obj of particles){const ox=Math.cos(obj.a)*obj.r*Math.min(W,H),oy=Math.sin(obj.a)*obj.r*Math.min(W,H),along=ox*dx+oy*dy,side=Math.abs(ox*dy-oy*dx);if(along>0&&along<reach&&side<Math.max(5,obj.size*1.25)&&(!hit||along<hit.along))hit={along,hue:obj.hue}}ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(dx*(hit?hit.along:reach),dy*(hit?hit.along:reach));ctx.strokeStyle=hit?'hsla('+hit.hue+',100%,68%,.98)':'rgba(255,255,255,'+(.5+amp*.45)+')';ctx.lineWidth=.65+amp*1.7+rayShimmer*1.4;ctx.shadowBlur=rayShimmer*15+amp*8;ctx.shadowColor=hit?'hsl('+hit.hue+',100%,65%)':'#fff';ctx.stroke()}
ctx.shadowBlur=0;
for(const p of particles){const x=Math.cos(p.a)*p.r*Math.min(W,H),y=Math.sin(p.a)*p.r*Math.min(W,H),s=p.size*(.45+p.life);ctx.save();ctx.translate(x,y);ctx.rotate(p.seed+p.life*2);ctx.fillStyle='hsla('+p.hue+',100%,70%,'+p.life+')';ctx.shadowBlur=12*p.life;ctx.shadowColor='hsl('+p.hue+',100%,65%)';if(p.kind==='drum'){ctx.fillRect(-s/2,-s/2,s,s)}else{ctx.beginPath();ctx.arc(0,0,s,0,TAU);ctx.fill()}ctx.restore()}
ctx.shadowBlur=0;const core=4+energy.bass*17+pop*8;ctx.beginPath();ctx.arc(0,0,core,0,TAU);ctx.fillStyle='#fff0ff';ctx.shadowBlur=20+energy.bass*30;ctx.shadowColor='#ff4db8';ctx.fill();ctx.restore();
particles.forEach(p=>{p.life-=.012*danceSpeed;if(p.radialSpeed){p.r+=p.radialSpeed;p.a+=p.angularSpeed||0}});particles=particles.filter(p=>p.life>0&&p.r<1.6);beatPulse*=.87;pop*=.82;rayShimmer*=.9;danceOffset+=(danceTarget-danceOffset)*.075;if(!raysFrozen)angle+=energy.mid*.0018*rayDirection;spinAngle+=spinRate/60;spinRate*=.965;
readout.innerHTML=(running?'PLAYING':'STOPPED')+' · BAR '+(bar+1)+'<br>FOV '+Math.round(fov+energy.bass*26)+'° · '+rayCount+' RAYS · '+Math.round(Number($('bpm').value||112))+' BPM';
}
function frame(now){const dt=Math.min(.05,(now-lastFrame)/1000||0);lastFrame=now;if(analyser)readAudio();fov=baseFov+energy.bass*18+pop*6;rayCount=clamp(rayBaseCount+Math.round(energy.high*28),8,256);if(running){angle+=dt*(.08+energy.mid*.2);if(step===0&&bar%4===0)spin+=dt*.3}draw(now);requestAnimationFrame(frame)}
$('play').onclick=()=>running?pause():start();$('stop').onclick=stop;$('regen').onclick=regenerate;$('addDrum').onclick=()=>{const tr=makeDrum('DRUM KIT '+String(tracks.filter(t=>t.type==='drum').length+1).padStart(2,'0'));while(tr.pages.length<pageCount)tr.pages.push(blankPattern('drum'));tracks.push(tr);renderTracks()};$('addPiano').onclick=()=>{const tr=makePiano('PIANO '+String(tracks.filter(t=>t.type==='piano').length+1).padStart(2,'0'));while(tr.pages.length<pageCount)tr.pages.push(blankPattern('piano'));tracks.push(tr);renderTracks()};$('addDance').onclick=()=>{const tr=makeDance('DANCE '+String(tracks.filter(t=>t.type==='dance').length+1).padStart(2,'0'));while(tr.pages.length<pageCount)tr.pages.push(blankPattern('dance'));tracks.push(tr);renderTracks()};$('noise').onchange=e=>{noiseEnabled=e.target.checked;if(noiseGain)noiseGain.gain.setTargetAtTime(noiseEnabled?.018:0,audioCtx.currentTime,.05)};$('autoFill').onchange=e=>{autoFill=e.target.checked};
$('prevPage').onclick=()=>{activePage=Math.max(0,activePage-1);renderTracks()};$('nextPage').onclick=()=>{activePage=Math.min(pageCount-1,activePage+1);renderTracks()};$('addPage').onclick=()=>{if(pageCount>=32)return;pageCount++;for(const tr of tracks)tr.pages.push(blankPattern(tr.type));activePage=pageCount-1;renderTracks()};$('removePage').onclick=()=>{if(pageCount<=1)return;for(const tr of tracks)tr.pages.splice(activePage,1);pageCount--;activePage=Math.min(activePage,pageCount-1);renderTracks()};
$('bpm').onchange=e=>{e.target.value=clamp(Number(e.target.value)||112,55,190)};
let drag=null;canvas.addEventListener('pointerdown',e=>{drag=e.clientX;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(drag!==null){const dx=e.clientX-drag;angle+=dx*.009;drag=e.clientX}});for(const ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,()=>drag=null);
renderTracks();resize();window.addEventListener('resize',resize);let drawerHeight=Math.min(innerHeight*.48,430),drawerStart=null;const panel=$('panel'),grip=$('drawerGrip');function setDrawerHeight(h){drawerHeight=clamp(h,150,Math.max(190,innerHeight-120));panel.style.setProperty('--drawer-height',drawerHeight+'px')}grip.addEventListener('pointerdown',e=>{if(e.target===$('drawerToggle'))return;drawerStart={y:e.clientY,h:drawerHeight};grip.setPointerCapture(e.pointerId)});grip.addEventListener('pointermove',e=>{if(drawerStart)setDrawerHeight(drawerStart.h+drawerStart.y-e.clientY)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])grip.addEventListener(ev,()=>drawerStart=null);$('drawerToggle').onclick=()=>{const c=panel.classList.toggle('collapsed');$('drawerToggle').textContent=c?'⌃ EXPAND':'⌄ DRAWER'};setDrawerHeight(drawerHeight);requestAnimationFrame(frame);
})();
</script></body></html>
