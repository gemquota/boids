<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BOIDS // Plant Laboratory</title>
<style>
:root{color-scheme:dark;--ink:#e8f1f4;--muted:#829aa6;--line:#ffffff20;--accent:#70f5d2}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#040911;color:var(--ink);font-family:Inter,system-ui,sans-serif}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.panel{position:fixed;z-index:2;left:12px;top:12px;width:min(310px,calc(100vw - 24px));padding:13px;border:1px solid var(--line);border-radius:13px;background:#081521df;backdrop-filter:blur(16px);box-shadow:0 12px 42px #0008}
h1{font-size:14px;letter-spacing:.12em;margin:0 0 4px;color:var(--accent)}.sub{font-size:9px;color:var(--muted);margin-bottom:12px}
.row{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.row button{flex:1;min-width:68px;background:#ffffff0b;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px;font-size:10px}
.control{display:grid;grid-template-columns:1fr auto;gap:5px;margin:10px 0;font-size:10px}.control output{color:var(--accent);font-variant-numeric:tabular-nums}.control input{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.stat{background:#ffffff08;padding:7px;border-radius:7px}.stat b{display:block;font-size:16px}.stat span{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.note{font-size:9px;line-height:1.5;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<canvas id="world"></canvas>
<section class="panel">
<h1>PLANT LABORATORY</h1><div class="sub">Isolated plant ecology · extracted from BOIDS</div>
<div class="row"><button id="pause">Pause</button><button id="reset">Reseed</button><button id="water">Waterways</button></div>
<label class="control">Growth rate <output id="growthValue"></output><input id="growth" type="range" min=".01" max=".18" step=".005" value=".0675"></label>
<label class="control">Simulation speed <output id="speedValue"></output><input id="speed" type="range" min=".25" max="3" step=".05" value="1"></label>
<label class="control">Spore interval <output id="sporeValue"></output><input id="spore" type="range" min="5" max="35" step="1" value="18"></label>
<div class="stats"><div class="stat"><b id="plants">0</b><span>Plant nodes</span></div><div class="stat"><b id="spores">0</b><span>Dispersing spores</span></div><div class="stat"><b id="flowers">0</b><span>Flowering nodes</span></div></div>
<div class="note">This lab runs plant growth and rendering without boids, predation, or the main simulation UI. Water proximity still drives morphology and germination. Tap the world to introduce a spore.</div>
</section>
<script>
'use strict';
const canvas=document.querySelector('#world'),ctx=canvas.getContext('2d'),TAU=Math.PI*2;
let W=1,H=1,dpr=1,simTime=0,running=true,showWater=true,last=0,plants=[],spores=[],nextPlantId=1,rng=20261115;
const cfg={plantGrowth:.0675,sporeInterval:18};
const plantCounters={asexualBuds:0,sporesReleased:0,sporesGerminated:0,plantDeaths:0};
const rand=(a,b)=>a+random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function random(){rng^=rng<<13;rng^=rng>>>17;rng^=rng<<5;return(rng>>>0)/4294967296}
function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

// A deterministic meandering freshwater channel supplies the plant habitat gradient.
function waterPoint(t){return{x:W*(.08+.84*t),y:H*(.5+.2*Math.sin(t*TAU*1.1)+.075*Math.sin(t*TAU*3.2+.8))}}
function nearestFreshwater(x,y){let best=Infinity;for(let i=0;i<=100;i++){const p=waterPoint(i/100),d=Math.hypot(x-p.x,y-p.y);if(d<best)best=d}return{distance:best}}
function nearestSaltwater(x,y){return{distance:Math.min(x,y,W-x,H-y)}}
function plantHabitat(x,y){const fresh=nearestFreshwater(x,y).distance,salt=nearestSaltwater(x,y).distance,latitude=Math.abs(2*y/Math.max(1,H)-1);return{mangrove:salt<32&&fresh>55,saltSpines:salt<fresh,freshDistance:fresh,saltDistance:salt,latitude}}
function plantMorphologyFromGradients(waterProximity,latitude){const wet=clamp(waterProximity,0,1),lat=clamp(latitude,0,1);return{nodeScale:.82+.28*wet,branchLengthScale:1.55-.8*wet,branchThicknessScale:.72+.68*wet,branchLimit:4-Math.round(2*wet),latitudeScale:1.05-.1*lat}}
function plantNodeGrowthScale(nodeSize,wholePlantSize){const ratio=clamp((Number(nodeSize)||.03)/Math.max(.03,Number(wholePlantSize)||.03),.2,1);return{ratio,scale:.35+.65*ratio}}
function applyPlantMorphology(p,habitat){const waterProximity=clamp(1-(habitat.freshDistance||0)/230,0,1),m=plantMorphologyFromGradients(waterProximity,habitat.latitude);p.freshDistance=habitat.freshDistance;p.waterProximity=waterProximity;p.nodeScale=m.nodeScale;p.branchLengthScale=m.branchLengthScale;p.branchThicknessScale=m.branchThicknessScale;p.branchLimit=m.branchLimit;p.latitudeScale=m.latitudeScale;p.waterVariant=habitat.mangrove?'mangrove':habitat.freshDistance<66?'riparian':habitat.freshDistance>175?'long':'standard';p.mangrove=p.waterVariant==='mangrove';p.saltSpines=p.mangrove?false:(p.saltSpines??habitat.saltSpines);return p}
function plantCollisionRadius(p){return 4.5+Math.max(.03,Number(p.size)||.2)*5.5}
function plantPositionClear(x,y,size=.2,ignoreId=0){const r=plantCollisionRadius({size});for(const p of plants){if(p.id===ignoreId)continue;const dx=p.x-x,dy=p.y-y,m=r+plantCollisionRadius(p);if(dx*dx+dy*dy<m*m)return false}return true}
function findPlantGrowthPosition(parent,angle,distance,size=.2){const offsets=[0,-.28,.28,-.55,.55,-.85,.85,-1.15,1.15,Math.PI];for(const stretch of [1,1.18,1.36])for(const offset of offsets){const a=angle+offset,x=clamp(parent.x+Math.cos(a)*distance*stretch,8,W-8),y=clamp(parent.y+Math.sin(a)*distance*stretch,8,H-8);if(plantPositionClear(x,y,size,parent.id))return{x,y,angle:a}}return null}
function plantHueAt(x,y,ignoreId=0){let sx=0,sy=0,total=0,count=0;for(const p of plants){if(p.id===ignoreId)continue;const dx=p.x-x,dy=p.y-y,d2=dx*dx+dy*dy;if(d2>180*180)continue;const hue=Number.isFinite(p.hue)?p.hue:(((p.root||p.id||1)*2654435761)>>>0)%360,w=(.25+Math.max(.05,p.size||.2)*1.5)/(1+d2/4096),a=hue*Math.PI/180;sx+=Math.cos(a)*w;sy+=Math.sin(a)*w;total+=w;count++}return !count||total<=0?rand(0,360):(Math.atan2(sy,sx)*180/Math.PI+360)%360}
function plantStage(p){if(p.dead)return'dead';if(p.senescent||p.age>=(p.lifespan||84))return'senescent';if(p.greatGrandmother)return'great-grandmother';if(p.grandmother)return'grandmother';if(p.adultNode)return'mature';if(p.age<8||p.biomass<.32)return'seedling';if(p.age<18||p.biomass<.65)return'juvenile';return'mature'}
function makePlantNode(values){let id=nextPlantId++;const p={id,parent:0,root:id,x:0,y:0,angle:rand(0,TAU),size:.3,biomass:.2,age:0,children:0,grandmother:false,greatGrandmother:false,adultNode:false,offspring:0,sporeClock:0,depth:0,lifespan:rand(110,140),senescent:false,cloneParent:0,asexual:false,flowerCount:0,flowerGrowth:0,...values,id};p.x=clamp(p.x,4,W-4);p.y=clamp(p.y,4,H-4);applyPlantMorphology(p,plantHabitat(p.x,p.y));if(!Number.isFinite(p.hue))p.hue=plantHueAt(p.x,p.y);return p}
function seedPlants(){plants=[];spores=[];nextPlantId=1;for(const k of Object.keys(plantCounters))plantCounters[k]=0;const n=Math.max(16,Math.min(30,Math.round(W*H/56000)));for(let i=0;i<n;i++){const source=i%3,ox=W*(.2+source*.3),oy=H*(source===1?.28:.68),a=rand(0,TAU),spread=rand(0,Math.min(W,H)*.25),speed=rand(4,12);spores.push({x:clamp(ox+Math.cos(a)*spread,8,W-8),y:clamp(oy+Math.sin(a)*spread,8,H-8),vx:Math.cos(a)*speed+rand(-2,2),vy:Math.sin(a)*speed+rand(-2,2),life:rand(0,2),settleAfter:rand(5,10),landed:false,settleClock:0,parentId:0,root:0,kind:'initial-dispersal-spore'})}}
function growPlants(dt){const existing=plants.length,whole=new Map();for(const p of plants){const root=p.root||p.id;whole.set(root,(whole.get(root)||0)+Math.max(.03,p.size||.03))}
for(let i=0;i<existing;i++){const p=plants[i];p.grandmother=!!p.grandmother;p.greatGrandmother=!!p.greatGrandmother;p.adultNode=!!p.adultNode;p.senescent=!!p.senescent;p.offspring=p.offspring||0;p.lifespan=p.lifespan||rand(110,140);p.cloneParent=p.cloneParent||0;p.asexual=!!p.asexual;p.age+=dt;applyPlantMorphology(p,plantHabitat(p.x,p.y));const nodeGrowth=plantNodeGrowthScale(p.size,whole.get(p.root||p.id)||p.size||.2);p.nodeSizeRatio=nodeGrowth.ratio;p.nodeGrowthScale=nodeGrowth.scale;p.stage=plantStage(p);
if(p.age>=p.lifespan){p.senescent=true;p.biomass=Math.max(0,p.biomass-dt*(.0045+Math.max(0,.22-p.biomass)*.01))}else{const maturity=p.age>p.lifespan*.78?.28:1,water=.9+.2*p.waterProximity;p.biomass=Math.min(1.6,p.biomass+cfg.plantGrowth*dt*(p.depth?.15:.125)*maturity*water*nodeGrowth.scale*p.latitudeScale)}
p.size=Math.max(.03,Math.min(.8,(.18+p.biomass*.85)*.5*p.nodeScale*p.latitudeScale));
const canReproduce=!p.senescent&&p.age<p.lifespan*.82&&p.stage==='mature',limit=p.branchLimit;
if(canReproduce&&p.biomass>=.72&&p.children<limit&&plants.length<90){const side=p.children%2===0?-1:1,a=p.angle+side*(.72+rand(0,.24)),len=(4.8+p.size*7)*.5*p.branchLengthScale,pos=findPlantGrowthPosition(p,a,len,.2);if(pos){p.children++;plants.push(makePlantNode({parent:p.id,root:p.root,x:pos.x,y:pos.y,angle:pos.angle,size:.2,biomass:.22,depth:p.depth+1,cloneParent:p.id,asexual:true}));plantCounters.asexualBuds++}}
if(canReproduce&&!p.grandmother&&p.biomass>=1.24){p.grandmother=true;p.flowerCount=3+Math.floor(random()*3);p.flowerGrowth=0}if(p.grandmother)p.flowerGrowth=Math.min(1,(p.flowerGrowth||0)+dt*.12);if(!p.senescent&&p.grandmother&&!p.greatGrandmother&&p.biomass>=1.48)p.greatGrandmother=true;
if(canReproduce&&p.age>12&&p.biomass>=.78){p.sporeClock=(p.sporeClock||0)+dt;const interval=cfg.sporeInterval*(p.depth?1.2:1);if(p.sporeClock>interval&&spores.length<90){p.sporeClock=0;const a=rand(0,TAU),v=rand(5,13);spores.push({x:p.x,y:p.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0,settleAfter:rand(4,8),landed:false,settleClock:0,parentId:p.id,root:p.root,kind:'asexual-spore'});plantCounters.sporesReleased++}}p.stage=plantStage(p)}
for(const s of spores){s.life+=dt;if(!s.landed){s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=.992;s.vy*=.992;if(s.x<4){s.x=4;s.vx=Math.abs(s.vx)}else if(s.x>W-4){s.x=W-4;s.vx=-Math.abs(s.vx)}if(s.y<4){s.y=4;s.vy=Math.abs(s.vy)}else if(s.y>H-4){s.y=H-4;s.vy=-Math.abs(s.vy)}if(s.life>=(s.settleAfter||7)){s.landed=true;s.vx=0;s.vy=0;s.settleClock=0;s.x=clamp(s.x,8,W-8);s.y=clamp(s.y,8,H-8)}}else s.settleClock=(s.settleClock||0)+dt}
for(let i=spores.length-1;i>=0;i--){const s=spores[i];let remove=s.life>24;if(!remove&&s.landed&&s.settleClock>=1.8){const crowded=!plantPositionClear(s.x,s.y,.2),distance=nearestFreshwater(s.x,s.y).distance,wet=clamp(1-distance/230,0,1),chance=.08+.84*wet;if(!crowded&&plants.length<90&&random()<chance){const id=nextPlantId++;plants.push(makePlantNode({id,x:s.x,y:s.y,age:0,biomass:.2,size:.2,cloneParent:s.parentId||0,asexual:true}));plantCounters.sporesGerminated++;remove=true}else if(crowded||wet<.08||s.settleClock>8)remove=true;else s.settleClock=0}if(remove)spores.splice(i,1)}
for(let i=plants.length-1;i>=0;i--){const p=plants[i];if(p.biomass<=.035||p.age>p.lifespan+18){for(const child of plants)if(child.parent===p.id){child.parent=0;child.root=child.id;child.depth=0;child.asexual=true}plants.splice(i,1);plantCounters.plantDeaths++}}for(const p of plants)p.stage=plantStage(p)}
function plantPalette(p){const seed=((p.root||p.id||1)*2654435761)>>>0,h=Number.isFinite(p.hue)?((p.hue%360)+360)%360:(seed%360+(p.depth||0)*5)%360,q=(h+22)%360;return{base:'hsl('+h+' 88% 58%)',deep:'hsl('+h+' 82% 39%)',accent:'hsl('+q+' 92% 69%)',edge:'hsl('+q+' 88% 82%)',arm:'hsl('+q+' 84% 65%)',flower:'hsl('+((h+48)%360)+' 96% 76%)'}}
function hexPath(x,y,r,a=-Math.PI/2){ctx.beginPath();for(let k=0;k<6;k++){const t=a+k*Math.PI/3,px=x+Math.cos(t)*r,py=y+Math.sin(t)*r;k?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath()}
function drawPlantFronds(p){const c=plantPalette(p),mature=!!(p.adultNode||p.grandmother||p.greatGrandmother),old=!!p.senescent,n=old?3:p.greatGrandmother?9:p.grandmother?7:mature?5:3,scale=(6+p.size*8.5)*(mature?1.24:.82)*(old?.68:1)*.5*(p.waterVariant==='riparian'?.68:1),phase=simTime*(old?.18:.42)+(p.id%23)*.37;ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.globalAlpha=old?.48:.9;for(let k=0;k<n;k++){const spread=n===1?0:(k/(n-1)-.5),a=p.angle+spread*1.55+Math.sin(phase+k*.8)*.055,len=scale*(.72+.28*Math.cos(spread*Math.PI))*(p.branchLengthScale||1),ux=Math.cos(a),uy=Math.sin(a),px=-uy,py=ux,sx=p.x+ux*.7,sy=p.y+uy*.7,ex=p.x+ux*len,ey=p.y+uy*len,cx=p.x+ux*len*.55+px*Math.sin(phase+k)*scale*.12,cy=p.y+uy*len*.55+py*Math.sin(phase+k)*scale*.12,w=Math.max(.65,(.9+p.size*.32)*(p.branchThicknessScale||1));ctx.strokeStyle=old?'rgba(166,181,174,.62)':c.arm;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(sx,sy);ctx.quadraticCurveTo(cx,cy,ex,ey);ctx.stroke();const side=spread===0?1:(k%2?1:-1),ll=len*.38,lw=Math.max(.8,scale*.105),lx=ex-ux*ll*.56+px*side*ll*.16,ly=ey-uy*ll*.56+py*side*ll*.16,tx=ex+px*side*ll*.22,ty=ey+py*side*ll*.22;ctx.beginPath();ctx.moveTo(lx,ly);ctx.quadraticCurveTo(lx+px*side*lw+ux*ll*.18,ly+py*side*lw+uy*ll*.18,tx,ty);ctx.quadraticCurveTo(lx-px*side*lw*.35+ux*ll*.2,ly-py*side*lw*.35+uy*ll*.2,lx,ly);ctx.fillStyle=old?'rgba(155,169,162,.42)':c.base;ctx.fill();ctx.strokeStyle=old?'rgba(188,199,191,.45)':c.edge;ctx.lineWidth=.55;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(tx,ty);ctx.stroke();if(!old&&k<(p.flowerCount||0)){const bloom=Math.max(.05,Math.min(1,p.flowerGrowth||0)),petal=Math.max(.7,scale*.09)*bloom;ctx.save();ctx.globalAlpha*=bloom;ctx.fillStyle=c.flower;ctx.strokeStyle=c.edge;ctx.lineWidth=.45;for(let j=0;j<5;j++){const t=j*Math.PI*2/5;ctx.beginPath();ctx.arc(ex+Math.cos(t)*petal*.72,ey+Math.sin(t)*petal*.72,petal*.62,0,TAU);ctx.fill();ctx.stroke()}ctx.fillStyle='#fff0a6';ctx.beginPath();ctx.arc(ex,ey,Math.max(.45,petal*.42),0,TAU);ctx.fill();ctx.restore()}}ctx.restore()}
function drawPlantNode(p){const c=plantPalette(p),old=!!p.senescent,r=(2.8+Math.min(3.4,p.size*2.7))*.25*(p.nodeScale||1);if(p.waterVariant==='mangrove'){const sway=Math.sin(simTime*.34+p.id*.7)*.06,canopy=5.5+p.size*9;ctx.save();ctx.lineCap='round';ctx.strokeStyle='#b58a61';ctx.lineWidth=Math.max(1,1.3+p.size);for(let k=0;k<5;k++){const a=(k/4-.5)*1.9;ctx.beginPath();ctx.moveTo(p.x,p.y+1);ctx.quadraticCurveTo(p.x+Math.sin(a)*canopy*.45,p.y+canopy*.35,p.x+Math.sin(a+sway)*canopy*.72,p.y+canopy*.9);ctx.stroke()}ctx.strokeStyle='#a87955';ctx.lineWidth=Math.max(1,1.2+p.size);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x,p.y-canopy*.75);ctx.stroke();ctx.fillStyle=old?'#77836d':'#397f61';ctx.strokeStyle='#a1c58a';ctx.lineWidth=.8;for(let k=0;k<7;k++){const a=k/7*TAU,rr=canopy*(.42+.13*Math.sin(k*3+p.id));ctx.beginPath();ctx.ellipse(p.x+Math.cos(a)*rr*.62,p.y-canopy*.72+Math.sin(a)*rr*.42,canopy*.34,canopy*.23,a*.22,0,TAU);ctx.fill();ctx.stroke()}ctx.restore();return}drawPlantFronds(p);ctx.save();ctx.globalAlpha=old?.45:.9;ctx.fillStyle=old?'#89958f':c.accent;ctx.strokeStyle=old?'#bdc6bf':c.edge;ctx.lineWidth=.7;hexPath(p.x,p.y,r,p.angle);ctx.fill();ctx.stroke();ctx.save();ctx.globalAlpha=old?.28:.52;ctx.strokeStyle=c.deep;ctx.lineWidth=.65;hexPath(p.x,p.y,r*.56,p.angle+Math.PI/6);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x-r*.82,p.y);ctx.lineTo(p.x+r*.82,p.y);ctx.moveTo(p.x-r*.42,p.y-r*.72);ctx.lineTo(p.x+r*.42,p.y+r*.72);ctx.stroke();ctx.restore();if(p.saltSpines&&!old){ctx.save();ctx.strokeStyle=c.edge;ctx.fillStyle=c.accent;ctx.lineWidth=.8;for(let k=0;k<8;k++){const a=p.angle+k*Math.PI/4,sx=p.x+Math.cos(a)*r*.72,sy=p.y+Math.sin(a)*r*.72,ex=p.x+Math.cos(a)*r*1.75,ey=p.y+Math.sin(a)*r*1.75;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.lineTo(p.x+Math.cos(a+.22)*r*.65,p.y+Math.sin(a+.22)*r*.65);ctx.closePath();ctx.fill();ctx.stroke()}ctx.restore()}ctx.restore()}
function draw(){const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#071927');g.addColorStop(.5,'#06131f');g.addColorStop(1,'#030a13');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);if(showWater){ctx.save();ctx.lineCap='round';ctx.lineWidth=Math.max(8,H*.022);ctx.strokeStyle='rgba(9,43,57,.9)';ctx.beginPath();for(let i=0;i<=100;i++){const p=waterPoint(i/100);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}ctx.stroke();ctx.lineWidth=Math.max(5,H*.012);ctx.strokeStyle='rgba(24,107,137,.88)';ctx.stroke();ctx.restore()}for(const s of spores){ctx.fillStyle=s.landed?'#b8e8d6':'#e5f4c5';ctx.globalAlpha=s.landed?.65:.9;ctx.beginPath();ctx.arc(s.x,s.y,s.landed?1.7:2.2,0,TAU);ctx.fill()}ctx.globalAlpha=1;for(const p of plants)drawPlantNode(p);const f=document.querySelector('#plants');f.textContent=plants.length;document.querySelector('#spores').textContent=spores.length;document.querySelector('#flowers').textContent=plants.filter(p=>p.grandmother||p.greatGrandmother).length}
function frame(now){const dt=Math.min(.05,(now-last)/1000||0)*Number(document.querySelector('#speed').value);last=now;if(running){simTime+=dt;growPlants(dt)}draw();requestAnimationFrame(frame)}
canvas.addEventListener('pointerdown',e=>{const x=e.clientX,y=e.clientY;if(plantPositionClear(x,y,.2)){spores.push({x,y,vx:rand(-3,3),vy:rand(-3,3),life:0,settleAfter:1,landed:false,settleClock:0,parentId:0,root:0,kind:'manual-spore'})}});
document.querySelector('#pause').onclick=()=>{running=!running;document.querySelector('#pause').textContent=running?'Pause':'Resume'};
document.querySelector('#reset').onclick=()=>{rng=20261115;seedPlants()};
document.querySelector('#water').onclick=()=>{showWater=!showWater};
for(const [id,key,out] of [['growth','plantGrowth','growthValue'],['spore','sporeInterval','sporeValue']])document.querySelector('#'+id).addEventListener('input',e=>{cfg[key]=Number(e.target.value);document.querySelector('#'+out).textContent=Number(e.target.value).toFixed(key==='plantGrowth'?3:0)});
document.querySelector('#speed').addEventListener('input',e=>document.querySelector('#speedValue').textContent=Number(e.target.value).toFixed(2)+'×');
document.querySelector('#growthValue').textContent=cfg.plantGrowth.toFixed(3);document.querySelector('#sporeValue').textContent=cfg.sporeInterval;document.querySelector('#speedValue').textContent='1.00×';
seedPlants();requestAnimationFrame(frame);
</script>
</body></html>
