name: Emergence cosmology tests
on:
  push:
    paths:
      - 'cosmology.js'
      - 'tests/cosmology.test.cjs'
      - '.github/workflows/emergence-cosmology-tests.yml'
  pull_request:
    paths:
      - 'cosmology.js'
      - 'tests/cosmology.test.cjs'
      - '.github/workflows/emergence-cosmology-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/cosmology.test.cjs
