<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06121b"><title>BOIDS // evolutionary field</title><style>
:root{color-scheme:dark;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;color:#d8e8e6;background:#050d13}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}#world{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.bar{position:fixed;top:12px;left:12px;right:12px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 14px;border:1px solid #33565a;border-radius:5px 18px 5px 18px;background:linear-gradient(110deg,#071923ed,#0b2028e8);backdrop-filter:blur(16px);box-shadow:0 12px 42px #0007}button{border:1px solid #45636c;border-radius:9px;padding:8px 12px;background:#122c37;color:#e4f1f2;font:inherit;cursor:pointer}.brand{font-weight:800;letter-spacing:.22em;color:#8bf0ce;margin-right:auto;text-transform:uppercase}.brand:after{content:" / FIELD SYSTEM";font-size:8px;color:#789b9b;letter-spacing:.14em}.tabs{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:6px;border:1px solid #33565a;border-radius:5px 14px 5px 14px;background:#071820ed;box-shadow:0 12px 40px #0008}.tabs button{font:inherit;font-size:10px;letter-spacing:.12em;text-transform:uppercase;border-radius:4px;background:#102a31;border-color:#31545a}.tabs button.active{color:#8bf0ce;border-color:#8bf0ce;background:#153b3a}.panel{position:fixed;right:12px;top:76px;bottom:76px;width:min(390px,calc(100vw - 24px));padding:19px;border:1px solid #365c5c;border-radius:4px 18px 4px 18px;background:linear-gradient(155deg,#081b23f7,#07131cf7);box-shadow:0 20px 65px #000a;overflow:auto;transform:translateX(calc(100% + 20px));transition:transform .22s}.panel.open{transform:translateX(0)}.panel h2{letter-spacing:.19em;color:#8bf0ce;font-size:12px;text-transform:uppercase;border-bottom:1px solid #31545a;padding-bottom:12px}.panel h3{font-size:13px;color:#80ddca}.panel p{color:#b5c9ce;line-height:1.5}.muted{font-size:12px;color:#86a2ab!important}.control{margin:17px 0}.control>div,.metric{display:flex;justify-content:space- </style></head><body><canvas id="world"></canvas><header class="bar"><span class="brand">BOIDS</span><button id="pause">Pause</button><button id="reset">Reset</button><span id="stats"></span></header><nav class="tabs"><button data-tab="FIELD" class="active">Field</button><button data-tab="DNA">Fauna DNA</button><button data-tab="PLANTS">Flora DNA</button><button data-tab="OBSERVATORY">Observatory</button></nav><aside id="panel" class="panel"><button id="close" style="float:right">Close</button></aside><script type="module" src="./app.js"></script></body></html>
