<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Boids</title>
<style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;background:#07131b;color:#dcebf0}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:12px;left:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 24px);padding:10px 12px;border:1px solid #294451;border-radius:12px;background:#0a1b25e8;backdrop-filter:blur(8px)}
button{border:1px solid #42606c;background:#142d39;color:#e3f2f6;padding:7px 11px;border-radius:8px;font:inherit}
button:active{background:#285064}label{display:flex;gap:6px;align-items:center;color:#b8cbd2}input{width:84px;accent-color:#6cc7c2}
#stats{color:#9db6c0;font-variant-numeric:tabular-nums}#title{font-weight:700;letter-spacing:.12em;color:#8bd8cf}
@media(max-width:520px){#hud{gap:6px;padding:8px}label{font-size:12px}button{padding:6px 9px}}
</style>
</head>
<body>
<canvas id="world" aria-label="Boids flocking simulation"></canvas>
<div id="hud"><span id="title">BOIDS</span><button id="toggle">Pause</button><button id="reset">Reset</button><label>Agents <input id="count" type="range" min="20" max="240" value="100"></label><span id="stats"></span></div>
<script type="module">
const canvas=document.querySelector('#world'),ctx=canvas.getContext('2d');
const countInput=document.querySelector('#count'),stats=document.querySelector('#stats'),toggle=document.querySelector('#toggle');
let w=0,h=0,dpr=1,agents=[],running=true,last=0,lastDraw=0,frame=0;
let oldX=new Float64Array(0),oldY=new Float64Array(0),oldVX=new Float64Array(0),oldVY=new Float64Array(0);
const cfg={count:100,speed:2.0,perception:58,separation:22,align:0.85,cohesion:0.55,separate:1.35};
const rand=(a,b)=>a+Math.random()*(b-a);
const spriteRoot='art/transparent_37_circles/';
const spriteFiles=[];
const rows=[4,5,6,7,6,5,4];
for(let r=1;r<=7;r++){
  for(let c=1;c<=rows[r-1];c++){
    const suffix=(r===4&&c===4)?'_BASE':'';
    spriteFiles.push({r,c,q:Math.max(-3,-(r-4)-3)+(c-1),axialR:r-4,file:spriteRoot+'hex_r'+r+'_c'+c+suffix+'.png'});
  }
}
const spriteImages=spriteFiles.map(s=>{const image=new Image();image.src=s.file;return image});
const innerKeys=['4:4','3:3','3:4','4:3','4:5','5:3','5:4'];
const innerSeeds=innerKeys.map(key=>spriteFiles.findIndex(s=>s.r+':'+s.c===key));
function hexDistance(a,b){const dq=a.q-b.q,dr=a.axialR-b.axialR;return Math.max(Math.abs(dq),Math.abs(dr),Math.abs(dq+dr))}
function developmentPath(seedIndex){
  const origin=spriteFiles[seedIndex];
  return spriteFiles.map((sprite,index)=>({index,d:hexDistance(origin,sprite),angle:Math.atan2((sprite.axialR-origin.axialR)*Math.sqrt(3)/2,(sprite.q-origin.q)+(sprite.axialR-origin.axialR)/2)}))
    .sort((a,b)=>a.d-b.d||a.angle-b.angle).map(x=>x.index);
}
const developmentPaths=innerSeeds.map((_,i)=>developmentPath(innerSeeds[i]));
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function makeAgent(){
 const genes={
  morphology:rand(0,1),
  segmentVariation:Math.floor(rand(0,7)),
  growth:rand(.75,1.3),
  development:rand(.75,1.3),
  segmentMass:rand(.78,1.12)
 };
 const seedIndex=Math.min(6,Math.floor(genes.morphology*7));
 return {
  x:rand(0,w),y:rand(0,h),vx:rand(-1,1),vy:rand(-1,1),hue:rand(165,205),
  genes,seedIndex,path:developmentPaths[seedIndex],age:0,mass:1,
  segments:[{age:0,seedIndex,path:developmentPaths[seedIndex]}],history:new Float64Array(128),historyHead:0,historyCount:0
 };
}
function seed(){agents=Array.from({length:cfg.count},makeAgent)}
function step(dt){
 const p=agents,lim=cfg.perception,lim2=lim*lim,sep2=cfg.separation*cfg.separation;
 if(oldX.length!==p.length){oldX=new Float64Array(p.length);oldY=new Float64Array(p.length);oldVX=new Float64Array(p.length);oldVY=new Float64Array(p.length)}
 for(let i=0;i<p.length;i++){const a=p[i];oldX[i]=a.x;oldY[i]=a.y;oldVX[i]=a.vx;oldVY[i]=a.vy}
 for(let i=0;i<p.length;i++){
  const a=p[i],x0=oldX[i],y0=oldY[i];let ax=0,ay=0,cx=0,cy=0,sx=0,sy=0,n=0,sn=0;
  for(let j=0;j<p.length;j++){
   if(i===j)continue;
   const dx=oldX[j]-x0,dy=oldY[j]-y0,d2=dx*dx+dy*dy;
   if(d2>lim2||d2<.001)continue;
   ax+=oldVX[j];ay+=oldVY[j];cx+=oldX[j];cy+=oldY[j];n++;
   if(d2<sep2){sx-=dx/d2;sy-=dy/d2;sn++}
  }
  let vx=oldVX[i],vy=oldVY[i];
  if(n){let nx=ax/n,ny=ay/n,m=Math.hypot(nx,ny)||1;vx+=nx/m*cfg.align;vy+=ny/m*cfg.align;nx=cx/n-x0;ny=cy/n-y0;m=Math.hypot(nx,ny)||1;vx+=nx/m*cfg.cohesion;vy+=ny/m*cfg.cohesion}
  if(sn){const m=Math.hypot(sx,sy)||1;vx+=sx/m*cfg.separate;vy+=sy/m*cfg.separate}
  const v=Math.hypot(vx,vy)||1,massSpeed=1/Math.sqrt(a.mass);vx=vx/v*cfg.speed*massSpeed;vy=vy/v*cfg.speed*massSpeed;
  let x=x0+vx*dt,y=y0+vy*dt;const margin=18;
  if(x<margin)x=w-margin;if(x>w-margin)x=margin;if(y<margin)y=h-margin;if(y>h-margin)y=margin;
  a.historyHead=(a.historyHead+63)&63;const hi=a.historyHead*2;a.history[hi]=x0;a.history[hi+1]=y0;a.historyCount=Math.min(64,a.historyCount+1);
  a.age+=dt;a.mass=Math.min(9,a.mass+a.genes.growth*.0013*dt);
  const desiredSegments=Math.min(9,1+Math.floor((a.mass-1)/a.genes.segmentMass));
  for(let k=0;k<a.segments.length;k++)a.segments[k].age+=dt;
  while(a.segments.length<desiredSegments){const seed=(a.seedIndex+a.genes.segmentVariation*a.segments.length)%7;a.segments.push({age:0,seedIndex:seed,path:developmentPaths[seed]})}
  a.x=x;a.y=y;a.vx=vx;a.vy=vy;
 }
}
function drawOrganism(a){
 const count=a.segments.length,size=15.5+Math.min(2.5,a.mass*.18);
 for(let i=count-1;i>=0;i--){
  let x=a.x,y=a.y;
  if(i>0&&a.historyCount){const index=Math.min(i*4,a.historyCount-1),offset=((a.historyHead+index)&63)*2;x=a.history[offset];y=a.history[offset+1]}
  const segment=a.segments[i],stage=Math.min(36,Math.floor(segment.age*a.genes.development/24));
  const spriteIndex=segment.path[stage]??segment.seedIndex,image=spriteImages[spriteIndex];
  if(image?.complete&&image.naturalWidth)ctx.drawImage(image,x-size/2,y-size/2,size,size);
  else{ctx.fillStyle='hsl('+a.hue+' 68% 68%)';ctx.beginPath();ctx.arc(x,y,size*.43,0,Math.PI*2);ctx.fill()}
 }
}
function draw(){
 ctx.fillStyle='#07131b';ctx.fillRect(0,0,w,h);
 for(const a of agents)drawOrganism(a);
}
function loop(t){
 const dt=Math.min((t-last)/16.67||1,2);last=t;
 if(running)step(dt);
 if(!lastDraw||t-lastDraw>=1000/30){draw();lastDraw=t}
 if(++frame%12===0){
  const meanSegments=agents.reduce((sum,a)=>sum+a.segments.length,0)/(agents.length||1);
  stats.textContent=agents.length+' agents · '+meanSegments.toFixed(1)+' mean segments';
 }
 requestAnimationFrame(loop)
}
toggle.onclick=()=>{running=!running;toggle.textContent=running?'Pause':'Resume'};
document.querySelector('#reset').onclick=seed;
countInput.oninput=()=>{cfg.count=+countInput.value;seed()};
seed();requestAnimationFrame(loop);
</script>
</body></html>
